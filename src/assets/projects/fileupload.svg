<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1e2c"/><stop offset="1" stop-color="#2b2b40"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.06"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- upload card -->
  <rect x="120" y="80" width="560" height="515" rx="18" fill="#ffffff"/>
  <text x="155" y="135" font-size="26" font-weight="700" fill="#1e1e2c">Upload Files</text>
  <rect x="155" y="160" width="490" height="230" rx="14" fill="#f2faf9" stroke="#138781" stroke-width="3" stroke-dasharray="12 10"/>
  <!-- cloud with arrow -->
  <path d="M340 320h120a45 45 0 0 0 0-90 62 62 0 0 0-118-12 52 52 0 0 0-2 102z" fill="#138781"/>
  <path d="M400 310v-60M378 270l22-22 22 22" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="365" font-size="17" fill="#5a5a70" text-anchor="middle">Drag &amp; drop or click to browse</text>
  <!-- file rows -->
  <g>
    <rect x="155" y="415" width="490" height="70" rx="12" fill="#f4f4f8"/>
    <path d="M180 430h30l12 12v32h-42z" fill="#e74c3c"/><text x="201" y="466" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
    <text x="240" y="445" font-size="17" font-weight="600" fill="#1e1e2c">resume.pdf</text>
    <rect x="240" y="460" width="330" height="10" rx="5" fill="#e0e0ea"/>
    <rect x="240" y="460" width="330" height="10" rx="5" fill="#138781"/>
    <circle cx="610" cy="450" r="16" fill="#138781"/><path d="M602 450l6 6 10-11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="155" y="500" width="490" height="70" rx="12" fill="#f4f4f8"/>
    <path d="M180 515h30l12 12v32h-42z" fill="#3498db"/><text x="201" y="551" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">JPG</text>
    <text x="240" y="530" font-size="17" font-weight="600" fill="#1e1e2c">photo.jpg</text>
    <rect x="240" y="545" width="330" height="10" rx="5" fill="#e0e0ea"/>
    <rect x="240" y="545" width="215" height="10" rx="5" fill="#f29f67"/>
    <text x="610" y="556" font-size="15" font-weight="700" fill="#f29f67" text-anchor="middle">65%</text>
  </g>
  <!-- arrow to server -->
  <path d="M705 337h110" stroke="#f29f67" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
  <path d="M810 320l22 17-22 17" stroke="#f29f67" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- server -->
  <g transform="translate(860 150)">
    <rect x="0" y="0" width="230" height="110" rx="14" fill="#2f2f45" stroke="#45455f" stroke-width="2"/>
    <rect x="0" y="130" width="230" height="110" rx="14" fill="#2f2f45" stroke="#45455f" stroke-width="2"/>
    <rect x="0" y="260" width="230" height="110" rx="14" fill="#2f2f45" stroke="#45455f" stroke-width="2"/>
    <circle cx="35" cy="55" r="9" fill="#28c840"/><rect x="65" y="48" width="130" height="14" rx="7" fill="#45455f"/>
    <circle cx="35" cy="185" r="9" fill="#28c840"/><rect x="65" y="178" width="130" height="14" rx="7" fill="#45455f"/>
    <circle cx="35" cy="315" r="9" fill="#f29f67"/><rect x="65" y="308" width="130" height="14" rx="7" fill="#45455f"/>
    <text x="115" y="410" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Node.js + Multer</text>
    <text x="115" y="438" font-size="16" fill="#9a9ab0" text-anchor="middle">/uploads</text>
  </g>
</svg>
