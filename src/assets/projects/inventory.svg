    <rect x="114" y="163" width="50" height="22" rx="3" fill="#fff"/>
    <circle cx="240" cy="80" r="26" fill="#138781"/>
    <path d="M228 80l9 9 16-18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
