  <rect x="415" y="340" width="40" height="200" rx="6" fill="#138781"/>
  <rect x="475" y="450" width="40" height="90" rx="6" fill="#f29f67"/>
  <rect x="535" y="310" width="40" height="230" rx="6" fill="#138781"/>
  <rect x="595" y="370" width="40" height="170" rx="6" fill="#138781"/>
  <rect x="655" y="480" width="40" height="60" rx="6" fill="#f29f67"/>
